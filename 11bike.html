!-<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bike Racing Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    .wrap { text-align: center; }
    canvas {
      background: #444;
      border: 4px solid #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    p { margin-top: 10px; color: #ddd; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🏍️ Bike Racing Game</h2>
    <canvas id="game" width="400" height="600"></canvas>
    <p>Use ← and → arrow keys to move</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const bike = {
      x: 185,
      y: 500,
      w: 30,
      h: 60,
      speed: 6
    };

    let obstacles = [];
    let roadLines = [];
    let score = 0;
    let gameOver = false;
    let leftPressed = false;
    let rightPressed = false;

    for (let i = 0; i < 8; i++) {
      roadLines.push({ x: 195, y: i * 80, w: 10, h: 40 });
    }

    function createObstacle() {
      const lanes = [65, 185, 305];
      const laneX = lanes[Math.floor(Math.random() * lanes.length)];
      obstacles.push({ x: laneX, y: -60, w: 30, h: 60, speed: 5 + score * 0.05 });
    }

    function drawBike(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 30, 60);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x + 5, y + 10, 5, 0, Math.PI * 2);
      ctx.arc(x + 25, y + 10, 5, 0, Math.PI * 2);
      ctx.arc(x + 5, y + 50, 5, 0, Math.PI * 2);
      ctx.arc(x + 25, y + 50, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRoad() {
      ctx.fillStyle = '#666';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      roadLines.forEach(line => {
        ctx.fillRect(line.x, line.y, line.w, line.h);
        line.y += 6;
        if (line.y > canvas.height) line.y = -40;
      });
    }

    function update() {
      if (gameOver) return;

      drawRoad();

      if (leftPressed && bike.x > 20) bike.x -= bike.speed;
      if (rightPressed && bike.x < canvas.width - bike.w - 20) bike.x += bike.speed;

      drawBike(bike.x, bike.y, '#00e5ff');

      obstacles.forEach((obs, index) => {
        obs.y += obs.speed;
        drawBike(obs.x, obs.y, '#ff5252');

        if (
          bike.x < obs.x + obs.w &&
          bike.x + bike.w > obs.x &&
          bike.y < obs.y + obs.h &&
          bike.y + bike.h > obs.y
        ) {
          gameOver = true;
        }

        if (obs.y > canvas.height) {
          obstacles.splice(index, 1);
          score++;
        }
      });

      ctx.fillStyle = '#fff';
      ctx.font = '24px Arial';
      ctx.fillText('Score: ' + score, 10, 30);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '36px Arial';
        ctx.fillText('Game Over', 110, 280);
        ctx.font = '22px Arial';
        ctx.fillText('Refresh to Restart', 115, 320);
        return;
      }

      requestAnimationFrame(update);
    }

    setInterval(() => {
      if (!gameOver) createObstacle();
    }, 1200);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') leftPressed = true;
      if (e.key === 'ArrowRight') rightPressed = true;
    });

    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') leftPressed = false;
      if (e.key === 'ArrowRight') rightPressed = false;
    });

    update();
  </script>
</body>
</html>
