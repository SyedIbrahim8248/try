<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cricbuzz</title>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif; background: #f4f4f4;
    }
    header {
      background: #006400; color: #fff; padding: 15px; text-align: center;
    }
    nav {
      background: #004d00; padding: 10px; text-align: center;
    }
    nav a {
      color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold;
    }
    .container {
      max-width: 1000px; margin: auto; padding: 20px;
    }
    .scorecard {
      background: #fff; padding: 20px; margin-bottom: 20px;
      border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .match {
      border-bottom: 1px solid #ddd; padding: 10px 0;
    }
    .match:last-child { border-bottom: none; }
    footer {
      background: #006400; color: #fff; text-align: center; padding: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Cricbuzz</h1>
    <p>Personal Cricket Updates</p>
  </header>
  <nav>
    <a href="#scores">Live Scores</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="container">
    <section id="scores" class="scorecard">
      <h2>Live Scores</h2>
      <div id="matches"></div>
    </section>

    <section id="contact" class="scorecard">
      <h2>Contact</h2>
      <p>Email: mycricbuzz@example.com</p>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 My Cricbuzz | Built with HTML, CSS, JS</p>
  </footer>

  <script>
    async function fetchScores() {
      try {
        // Example API endpoint (replace with a real cricket API)
        const response = await fetch("https://api.cricapi.com/v1/currentMatches?apikey=015528e04211919eb097a58dea9d441d");
        const data = await response.json();

        const matchesDiv = document.getElementById("matches");
        matchesDiv.innerHTML = "";

        data.data.forEach(match => {
          const div = document.createElement("div");
          div.className = "match";
          div.innerHTML = `
            <strong>${match.name}</strong><br>
            ${match.status}<br>
            ${match.score ? match.score.map(s => `${s.inning}: ${s.r}`).join("<br>") : ""}
          `;
          matchesDiv.appendChild(div);
        });
      } catch (error) {
        document.getElementById("matches").innerHTML = "Error loading scores.";
        console.error(error);
      }
    }

    // Fetch scores every 30 seconds
    fetchScores();
    setInterval(fetchScores, 30000);
  </script>
</body>
</html>
