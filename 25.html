<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viadeo Style Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    .link {
      display: inline-block;
      margin: 15px;
      padding: 12px 20px;
      background: #ff6600;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .link:hover {
      background: #e65c00;
      transform: scale(1.1);
    }
    .play-effect {
      animation: pulse 0.6s;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>Viadeo Play Links</h1>
  
  <a href="https://www.viadeo.com" class="link">Viadeo</a>
  <a href="https://www.google.com" class="link">Google</a>
  <a href="https://www.github.com" class="link">GitHub</a>

  <script>
    // Add play effect when clicking links
    document.querySelectorAll('.link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault(); // prevent instant navigation
        this.classList.add('play-effect');
        setTimeout(() => {
          window.location.href = this.href; // go to link after animation
        }, 600);
      });
    });
  </script>
</body>
</html>
