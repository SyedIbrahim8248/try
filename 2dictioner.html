<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English to Hindi Dictionary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      text-align: left;
    }
    .word {
      font-weight: bold;
      font-size: 18px;
    }
    .meaning {
      margin-top: 10px;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📖 English → Hindi Dictionary</h2>
    <input type="text" id="wordInput" placeholder="Enter an English word...">
    <button onclick="translateWord()">Translate</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function translateWord() {
      const word = document.getElementById("wordInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (!word) {
        resultDiv.innerHTML = "<p>Please enter a word.</p>";
        return;
      }

      try {
        const response = await fetch(
          `https://api.mymemory.translated.net/get?q=${word}&langpair=en|hi`
        );
        const data = await response.json();

        const translation = data.responseData.translatedText;
        resultDiv.innerHTML = `
          <p class="word">${word}</p>
          <p class="meaning">${translation}</p>
        `;
      } catch (error) {
        resultDiv.innerHTML = "<p>Error fetching translation. Try again.</p>";
      }
    }
  </script>
</body>
</html>
