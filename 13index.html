<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Hero Section</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    .hero {
      position: relative;
      height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .hero-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
      animation: fadeInDown 2s ease-in-out;
    }
    .hero p {
      font-size: 1.2rem;
      margin-top: 10px;
      animation: fadeInUp 2s ease-in-out;
    }
    @keyframes fadeInDown {
      from {opacity: 0; transform: translateY(-50px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(50px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .typed-text {
      color: #00d9ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <!-- Bootstrap Carousel for background images -->
    <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://source.unsplash.com/1600x900/?technology" class="d-block w-100" alt="Tech">
        </div>
        <div class="carousel-item">
          <img src="https://source.unsplash.com/1600x900/?coding" class="d-block w-100" alt="Coding">
        </div>
        <div class="carousel-item">
          <img src="https://source.unsplash.com/1600x900/?webdesign" class="d-block w-100" alt="Web Design">
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div class="hero-overlay"></div>

    <!-- Content -->
    <div class="hero-content">
      <h1>Hello, I'm [Your Name]</h1>
      <p>I am a <span class="typed-text"></span></p>
      <a href="#projects" class="btn btn-primary btn-lg mt-3">View My Work</a>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Typed.js for animated text -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    var typed = new Typed(".typed-text", {
      strings: ["Front-End Developer", "UI/UX Designer", "JavaScript Enthusiast", "Creative Thinker"],
      typeSpeed: 100,
      backSpeed: 50,
      loop: true
    });
  </script>
</body>
</html>
