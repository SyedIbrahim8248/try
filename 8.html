<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flipkart Clone - Single File</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f3f6}
header{background:#2874f0;color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:bold}
.search{flex:1;max-width:500px}
.search input{width:100%;padding:12px;border:none;border-radius:6px}
.cart{background:#fff;color:#2874f0;padding:10px 18px;border-radius:6px;font-weight:bold}
.hero{background:#fff;margin:20px auto;max-width:1200px;padding:20px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);text-align:center}
.products{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:0 20px}
.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);text-align:center}
.card img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.card h3{margin:12px 0}
.card p{color:#16a34a;font-weight:bold;margin-bottom:10px}
button{background:#fb641b;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
#cartItems{max-width:1200px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
footer{text-align:center;padding:20px;background:#172337;color:#fff;margin-top:30px}
</style>
</head>
<body>
<header>
<div class="logo">Flipkart</div>
<div class="search"><input type="text" id="searchBox" placeholder="Search for products, brands and more" onkeyup="searchProducts()"></div>
<div class="cart">Cart: <span id="cartCount">0</span></div>
</header>

<div class="hero">
<h1>Flipkart Clone Website</h1>
<p>Built using pure HTML, CSS and JavaScript in one file</p>
</div>

<div class="products" id="productList"></div>

<div id="cartItems">
<h2>Your Cart</h2>
<ul id="cartList"></ul>
</div>

<footer>© 2026 Flipkart Clone Demo</footer>

<script>
const products=[
 {name:'iPhone 15',price:'₹79,999',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500'},
 {name:'Laptop',price:'₹55,000',img:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500'},
 {name:'Headphones',price:'₹2,999',img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500'},
 {name:'Smart Watch',price:'₹4,999',img:'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500'},
 {name:'Shoes',price:'₹1,999',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500'},
 {name:'Backpack',price:'₹999',img:'https://images.unsplash.com/photo-1581605405669-fcdf81165afa?w=500'}
];
let cart=[];

function renderProducts(list=products){
 const box=document.getElementById('productList');
 box.innerHTML='';
 list.forEach((p,i)=>{
   box.innerHTML += `
   <div class="card">
     <img src="${p.img}" alt="${p.name}">
     <h3>${p.name}</h3>
     <p>${p.price}</p>
     <button onclick="addToCart(${i})">Add to Cart</button>
   </div>`;
 });
}

function addToCart(i){
 cart.push(products[i]);
 document.getElementById('cartCount').innerText=cart.length;
 const cartList=document.getElementById('cartList');
 cartList.innerHTML='';
 cart.forEach(item=>{
   cartList.innerHTML += `<li>${item.name} - ${item.price}</li>`;
 });
}

function searchProducts(){
 const value=document.getElementById('searchBox').value.toLowerCase().trim();
 const filtered=products.filter(p=>
   p.name.toLowerCase().includes(value) ||
   p.price.toLowerCase().includes(value)
 );
 renderProducts(filtered);
}

renderProducts();
</script>
</body>
</html>
