<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 50px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }

    /* Popup background */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    /* Popup box */
    .popup-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: left;
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 18px;
      cursor: pointer;
      color: #333;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.8);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <h1>Popup Screen Demo</h1>
  <button id="openPopup">Open Popup</button>

  <!-- Popup -->
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <span class="close-btn" id="closePopup">&times;</span>
      <h2>Welcome!</h2>
      <p>This is a popup screen built with pure HTML, CSS, and JavaScript.</p>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openPopup');
    const closeBtn = document.getElementById('closePopup');
    const popup = document.getElementById('popup');

    // Open popup
    openBtn.addEventListener('click', () => {
      popup.style.display = 'flex';
    });

    // Close popup
    closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
    });

    // Close when clicking outside
    window.addEventListener('click', (e) => {
      if (e.target === popup) {
        popup.style.display = 'none';
      }
    });
  </script>
</body>
</html>
